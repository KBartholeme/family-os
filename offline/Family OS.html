<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23dbfb5f'/><text x='50' y='68' font-size='54' text-anchor='middle'>🏡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Shared components. Each theme (index.html / skandi.html) defines the color tokens and --radius. */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 20px}
.tabs a{padding:8px 16px;border-radius:var(--radius,12px);text-decoration:none;color:var(--muted);font-weight:700;font-size:14px;border:1px solid var(--line)}
.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:16px}
.toolbar .sum{margin-right:auto;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:var(--radius,12px);
  padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--warn)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:inherit;padding:0}
.hint{margin-top:28px;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}

.dgroup{margin-bottom:22px}
.dgroup h4{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.dgroup h4 span{font-weight:700;background:var(--line);color:var(--ink);border-radius:99px;padding:0 8px;font-size:12px}
.dgroup.overdue h4,.dgroup.soon h4{color:var(--warn)}
details.dgroup summary{list-style:none;cursor:pointer}
details.dgroup summary::-webkit-details-marker{display:none}
details.dgroup summary h4::after{content:"▸";margin-left:2px}
details.dgroup[open] summary h4::after{content:"▾"}

.drow,.crow,.docrow{display:flex;align-items:center;gap:14px;padding:12px 14px;margin-bottom:8px;background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius,12px);text-decoration:none;color:var(--ink);width:100%;text-align:left;cursor:pointer;font:inherit}
.drow:hover,.crow:hover,.docrow:hover{border-color:var(--ink)}
.drow.late{border-color:var(--warn)}
.drow.isdone{opacity:.55}.drow.isdone .t,.dtitle.isdone{text-decoration:line-through}
.dblock{flex-shrink:0;width:52px;text-align:center;font-size:12px;line-height:1.1;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dblock b{display:block;font-size:22px;color:var(--ink);letter-spacing:0}
.dblock small{display:block;font-size:10px}
.dmain{flex:1;min-width:0;display:flex;flex-direction:column}
.dmain .t{font-weight:700}
.dmain .m,.dside .m{color:var(--muted);font-size:13px}
.warnnote{color:var(--warn)!important}
.dside{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.docrow{margin-bottom:0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:10px 0;cursor:default}
.crow{cursor:default}
.docedit,.crowmain{display:flex;text-decoration:none;align-items:center;gap:14px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.extlink{flex-shrink:0;font-size:13px;font-weight:700;text-decoration:none;color:var(--a);padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--a) 12%,transparent)}
.extlink:hover{background:color-mix(in srgb,var(--a) 22%,transparent)}
.docrow:last-child{border-bottom:0}
.who{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:99px;font-size:11px;font-weight:800;border:1px solid var(--line);color:var(--muted)}
.who-A{color:var(--a);border-color:currentColor}.who-N{color:var(--n);border-color:currentColor}

.detail{max-width:680px}
.eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dtitle{margin:0 0 20px;font-size:clamp(26px,4vw,38px);line-height:1.15}
.dl{display:grid;grid-template-columns:minmax(120px,180px) 1fr;margin:0 0 16px;border-top:1px solid var(--line)}
.dl dt,.dl dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
.dl dt{color:var(--muted);font-size:14px}
.dl dd a{color:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:20px}

dialog#dlg{border:0;padding:0;border-radius:calc(var(--radius,12px) + 6px);background:var(--paper);color:var(--ink);width:min(460px,calc(100vw - 32px));box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog#dlg::backdrop{background:rgba(20,15,10,.45)}
.form{padding:22px;display:flex;flex-direction:column;gap:12px}
.form h2{margin:0 0 4px;font-size:22px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.form input,.form select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius,10px);padding:9px 11px;font-weight:400}
.form input:focus,.form select:focus{outline:2px solid var(--ink);outline-offset:-1px}
.form .actions{margin-top:8px}

@media (max-width:640px){
  .dl{grid-template-columns:1fr}.dl dt{border-bottom:0;padding-bottom:0}
  .drow,.crow{flex-wrap:wrap}.dside{width:100%;justify-content:flex-start;padding-left:66px}
  .crow .dside{padding-left:0}
}

/* Team & Rituale */
.setup{margin-bottom:22px}
.setup-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.setup .big{font-size:22px;font-weight:700;margin:2px 0}
.setup .m,.runcard .m,.ctx .m{color:var(--muted);font-size:14px}
.setup .actions{margin-top:0}
.lh{margin:8px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toolbar .lh{margin:0 auto 0 0}
.num{flex-shrink:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--coral);color:var(--on)}
.ctxtag{color:var(--a)}
.mv{display:flex;gap:2px;flex-shrink:0}
.mv button{border:1px solid var(--line);background:none;color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer}
.mv button:disabled{opacity:.3;cursor:default}
.drow.agenda,.drow.good{cursor:default}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px;flex-shrink:0}
.x:hover{color:var(--warn)}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;cursor:pointer;border:0;font:inherit;color:inherit}
.tcard b{font-size:18px}
.tcard .m{color:var(--muted);font-size:14px}
.when2{font-weight:600;font-size:14px}
.vnum{font-size:30px;font-weight:800;line-height:1;color:var(--coral)}
.goodform{display:flex;gap:8px;margin-bottom:22px}
.goodform input{flex:1;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:var(--radius,12px);padding:10px 14px}
.detail.wide{max-width:760px}
.runcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius,12px);padding:14px 16px;margin-bottom:12px}
.runhead{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.ctx{background:var(--bg);border-radius:calc(var(--radius,12px) - 4px);padding:10px 12px;margin-bottom:10px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.ctx a{color:var(--a)}
.ctxic{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;margin-right:8px;vertical-align:-4px;color:#fff;font-size:11px;background:var(--c)}
.ctxic svg{width:13px;height:13px}
.runcard textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:calc(var(--radius,12px) - 4px);padding:10px 12px;resize:vertical}
.chron{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:22px}
.chron::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--line)}
.chron-item{position:relative;display:flex;gap:14px;align-items:flex-start;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius,12px);text-decoration:none;color:var(--ink)}
.chron-item::before{content:"";position:absolute;left:-21px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--bg)}
.chron-item:hover{border-color:var(--ink)}
.chron-item .dmain{gap:2px}
.peek{font-size:14px;color:var(--ink);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.peek b{font-weight:700;margin-right:4px}
.feel{background:var(--bg);border-radius:calc(var(--radius,12px) - 4px);padding:10px 12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.feel .m{margin:0}
.feel label{display:grid;grid-template-columns:70px 1fr 90px;align-items:center;gap:10px;font-size:14px;font-weight:600}
.feel input[type=range]{width:100%;accent-color:var(--coral)}
.feel output{font-size:13px;color:var(--muted);text-align:right}
.feelchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.feelchips.big .chip{font-size:14px;padding:4px 12px}
.lastfeel{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.lastfeel .feelchips{margin-top:4px}
.nextcard{display:flex;align-items:center;gap:20px;padding:22px 24px;margin:4px 0 32px;background:var(--paper);border-radius:calc(var(--radius,12px) + 4px);box-shadow:var(--shadow,none);border:1px solid var(--line)}
.nc-date{flex-shrink:0;width:68px;height:68px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(180deg,color-mix(in srgb,var(--coral) 70%,#fff),var(--coral))}
.nc-date b{font-size:28px;line-height:1}
.nc-date span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.nc-main{flex:1;min-width:0}
.nc-main .eyebrow{margin:0 0 2px}
.nc-main .big{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
.nc-main .m{margin:4px 0 0;color:var(--muted);font-size:14px}
.nc-actions{display:flex;flex-direction:column;align-items:stretch;gap:10px;flex-shrink:0;min-width:180px}
.nc-actions .btn{justify-content:center;padding:11px 20px}
.nc-link{text-align:center;font-size:14px;font-weight:600;color:var(--a);text-decoration:none}
.nc-link:hover{text-decoration:underline}
@media (max-width:640px){.nextcard{flex-wrap:wrap;padding:18px}.nc-actions{width:100%;min-width:0}}
.tchips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tchips .m{font-size:13px}

/* Haushalt */
.check{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;padding:0;position:relative;opacity:.7}
.check:hover{opacity:1;border-color:var(--active)}
.check.on{background:var(--active);border-color:var(--active);opacity:1}
.check.on::after{content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.drow.chore{cursor:default}
.homecard .big{font-size:20px}
.homecard .loadbar{margin-top:10px;max-width:420px}
.seg.mini{align-self:center}
.seg.mini button{padding:4px 12px;font-size:13px}
.cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;margin-left:4px}
.dgroup h4 .linkbtn{margin-left:auto;text-transform:none;letter-spacing:0;font-size:13px}
.cols.plan{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.plancol{display:flex;flex-direction:column}
.planhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.planhead b{font-size:17px}
.planhead .m{width:100%;color:var(--muted);font-size:13px}
.planitem{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;font:inherit;color:inherit}
.planitem:last-child{border-bottom:0}
.planitem:hover .t{color:var(--a)}
.planitem .m{color:var(--muted);font-size:13px}
.homecard .m{margin-top:8px}

/* Gesundheit */
.dl.compact{grid-template-columns:minmax(110px,150px) 1fr;margin:0;border-top:0}
.dl.compact dt,.dl.compact dd{padding:8px 0;font-size:14px}
.dl.compact div:last-child{border:0}
.kidav.sm{width:26px;height:26px;font-size:13px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;background:var(--c)}
.docrow2{cursor:default}
.emerg .big{font-size:20px;margin:2px 0}
.emerg .big .m{font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
.emerg .nc-date{display:none}
.hpill{text-decoration:none;color:inherit}
.hpill .ok{color:var(--active);font-weight:600}
.emerg .btn.primary{background:var(--warn);border-color:var(--warn);color:#fff}

/* Ziele & Erinnerungen */
.gcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.gcard b{font-size:18px}
.gcard .m{color:var(--muted);font-size:14px}
.gcard:hover b{color:var(--a)}
.gcard.isdone{opacity:.7}
.cols.bucket{margin-bottom:24px}
.dream.isdone b{text-decoration:line-through;text-decoration-color:var(--muted)}
.cnt.neutral{background:var(--line);color:var(--ink)}
.chron-item.mem{align-items:center}
.chron-item.mem .docedit{align-items:flex-start}
.flash{margin-bottom:24px}
.flash .nc-date{background:linear-gradient(180deg,color-mix(in srgb,var(--peach) 70%,#fff),var(--peach))}
.flash .nc-date span{font-size:10px}

/* Orbit: drag to rearrange */
.planet{touch-action:none;user-select:none;-webkit-user-select:none}
.planet.dragging{z-index:10;animation:none!important;cursor:grabbing;scale:1.12;opacity:.92;transition:none}
.orbit.arranging .planet:not(.dragging){opacity:.75}
.planet.droptarget{opacity:1!important;outline:3px dashed var(--ink);outline-offset:4px}
.orbit-hint{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 0}

/* Woche */
.weekstrip{margin-top:28px}
.ws-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.ws-head h3{margin:0;font-size:20px}
.ws-head a{color:var(--a);text-decoration:none;font-weight:600;font-size:14px}
.ws-days{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.ws-day{display:flex;flex-direction:column;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius,12px);padding:10px;text-decoration:none;color:var(--ink);min-height:130px}
.ws-day:hover{border-color:var(--ink)}
.ws-day.today{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}
.ws-date{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:600}
.ws-date b{font-size:20px;color:var(--ink)}
.ws-item{display:flex;align-items:center;gap:6px;font-size:12px;line-height:1.2;min-width:0}
.ws-item.warn{color:var(--warn);font-weight:700}
.ws-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-more{font-size:12px;color:var(--muted)}
.wic{flex-shrink:0;width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;color:#fff;font-size:11px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c,var(--sky)) 70%,#fff),var(--c,var(--sky)))}
.wic svg{width:13px;height:13px}
.wic.g{--c:#4285f4}
.wic.car{--c:var(--muted)}
.drow.wk{gap:12px}
.wtime{flex-shrink:0;width:64px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.drow.wk .wic{width:28px;height:28px;border-radius:8px}.drow.wk .wic svg{width:16px;height:16px}
.drow .docedit .wic{width:28px;height:28px;border-radius:8px}
.gbadge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:800;color:#4285f4;border:1.5px solid #4285f4}
.wk-tools{flex-wrap:wrap;justify-content:flex-start}
.wk-range{font-weight:600;margin-right:auto}
.wkday h4{text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)}
.wkday.isToday h4{color:var(--a)}
@media (max-width:640px){.ws-days{grid-template-columns:repeat(7,120px)}.wtime{width:52px}}
.loadcard{display:grid;grid-template-columns:2fr 1fr;gap:28px;align-items:end;margin-top:20px}
.loadcard .lc-feel .lastfeel{margin:0;padding:0;border:0}
@media (max-width:760px){.loadcard{grid-template-columns:1fr;gap:12px}}
.drow.docline{cursor:default}
@media (max-width:640px){
  .drow.docline,.crow{flex-wrap:wrap}
  .docedit,.crowmain{flex-wrap:wrap;width:100%}
  .docedit .dside,.crowmain .dside{width:100%;justify-content:flex-start;padding-left:0}
  .drow.docline .extlink,.crow .extlink{margin-left:auto}
}

/* Finanzen */
.fin-pic,.fin-joint{margin-bottom:20px}
.stackbar{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 14px}
.fin-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fin-legend div{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.fin-legend div span{display:flex;align-items:center}
.fin-legend b{font-size:20px;color:var(--ink)}
.fin-legend .dot{margin-right:6px}
.jrows{display:flex;flex-direction:column}
.jrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.jrow span:nth-child(2){flex:1}
.jrow b{font-size:17px;font-variant-numeric:tabular-nums}
.keep{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:10px;font-size:14px;color:var(--muted)}
.keep b{color:var(--ink)}
.amt{font-variant-numeric:tabular-nums;font-size:16px;white-space:nowrap}
.big2{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.checkdue{border-color:var(--teal)}
@media (max-width:640px){.fin-legend{grid-template-columns:repeat(2,1fr)}}
.fhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}.fhead b{font-size:18px}.fhead .m{color:var(--muted);font-size:14px}

/* Kinder & Entwicklung */
.capwrap{margin-bottom:20px}
.capwrap h3{margin:0 0 10px}
.capture{display:flex;flex-direction:column;gap:10px}
.cap-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cap-row input[name=t]{flex:1;min-width:200px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius,12px);padding:10px 14px}
.cap-row select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius,10px);padding:6px 10px}
.pick label{position:relative;cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-block;padding:5px 12px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:600}
.pick input:checked+span{background:var(--paper);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.seg.pick{background:var(--fill,var(--line));border-radius:9px;padding:2px}
.kidcard{text-decoration:none;color:inherit}
.kc-moment{margin:12px 0 0;font-size:14px}
.kc-check{margin:8px 0 0;font-size:13px;color:var(--muted)}
.kc-check.due{color:var(--warn);font-weight:700}
.mic{margin-right:2px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.board .col{display:flex;flex-direction:column;gap:10px}
.board .lh{display:flex;align-items:center;gap:6px;margin:0 0 2px}
.kt{gap:6px}
.kt b{font-size:16px}
.rating{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-bottom:6px;background:var(--line)}

  .tile.wide{grid-column:span 2}
}
.login{max-width:420px;margin:12vh auto 0;background:var(--paper);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:12px}
.login h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;margin:0;font-size:26px}
.login p{margin:0;color:var(--muted)}
.login form{display:flex;gap:8px;flex-wrap:wrap}
.login input{flex:1 1 200px;min-width:0;font:inherit;padding:11px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.login button,.syncbar button{border:0;border-radius:999px;padding:11px 18px;background:#dbfb5f;color:#0e0e10;font:700 15px "Outfit",sans-serif;cursor:pointer}
.brandline{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.035em}
.brandline .b{color:var(--a)}
.syncbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:center;font-size:14px;z-index:50;max-width:calc(100vw - 32px)}
.syncbar[hidden]{display:none}
.footnote a{color:inherit}

<script>window.FOS_CATALOG = {"version": 1, "ages": {"from": 0, "to": 72, "unit": "months"}, "note": {"de": "Anregungen, keine Normen – jedes Kind entwickelt sich in seinem eigenen Tempo.", "en": "Suggestions, not norms – every child develops at their own pace."}, "areas": {"motor": {"de": "Motorik & Sport", "en": "Motor skills & sport"}, "lang": {"de": "Sprache & Lesen", "en": "Language & reading"}, "social": {"de": "Sozial-emotional", "en": "Social-emotional"}, "mind": {"de": "Denken & Neugier", "en": "Thinking & curiosity"}, "creative": {"de": "Kreativität & Musik", "en": "Creativity & music"}, "indep": {"de": "Selbstständigkeit", "en": "Independence"}, "nature": {"de": "Natur & Welt", "en": "Nature & world"}, "langs": {"de": "Sprachen", "en": "Languages"}}, "ideas": [{"id": "motor-001", "area": "motor", "from": 0, "to": 4, "de": "Bauchlage-Zeit", "en": "Tummy time", "tip_de": "Kurz und oft, auf Augenhöhe mitmachen", "tip_en": "Short and often, get down at eye level"}, {"id": "motor-002", "area": "motor", "from": 0, "to": 6, "de": "Greifspiele mit Rassel", "en": "Grasping games with a rattle", "tip_de": "Rassel seitlich anbieten, nicht in die Hand drücken", "tip_en": "Offer it from the side instead of placing it in the hand"}, {"id": "motor-003", "area": "motor", "from": 0, "to": 6, "de": "Babymassage", "en": "Baby massage", "tip_de": "Warme Hände, ruhiger Moment nach dem Baden", "tip_en": "Warm hands, a calm moment after the bath"}, {"id": "motor-004", "area": "motor", "from": 2, "to": 7, "de": "Strampeln auf der Decke", "en": "Kicking on a blanket", "tip_de": "Ohne Windel auf warmer Decke – viel Bewegungsfreiheit", "tip_en": "Diaper-free on a warm blanket – lots of freedom to move"}, {"id": "motor-005", "area": "motor", "from": 3, "to": 8, "de": "Drehen üben", "en": "Practice rolling over", "tip_de": "Spielzeug seitlich hinlegen, damit sich das Drehen lohnt", "tip_en": "Place a toy to the side so rolling is worth it"}, {"id": "motor-006", "area": "motor", "from": 5, "to": 10, "de": "Krabbelparcours aus Kissen", "en": "Cushion crawling course", "tip_de": "Kissen, Decken und Tunnel aus Kartons", "tip_en": "Cushions, blankets and cardboard tunnels"}, {"id": "motor-007", "area": "motor", "from": 6, "to": 12, "de": "Babyschwimmen", "en": "Baby swimming", "tip_de": "Wassergewöhnung mit viel Körperkontakt", "tip_en": "Water confidence with lots of body contact"}, {"id": "motor-008", "area": "motor", "from": 7, "to": 12, "de": "Hochziehen an Möbeln", "en": "Pulling up on furniture", "tip_de": "Kippsichere Möbel, Ecken entschärfen", "tip_en": "Tip-proof furniture, padded corners"}, {"id": "motor-009", "area": "motor", "from": 8, "to": 14, "de": "An der Hand laufen", "en": "Walking hand in hand", "tip_de": "Lieber an beiden Händen als hochziehen", "tip_en": "Hold both hands instead of pulling up"}, {"id": "motor-010", "area": "motor", "from": 9, "to": 15, "de": "Schiebewagen", "en": "Push-along walker", "tip_de": "Stabiler Schiebewagen statt Lauflernhilfe zum Hineinsetzen", "tip_en": "A sturdy push toy rather than a sit-in walker"}, {"id": "motor-011", "area": "motor", "from": 10, "to": 18, "de": "Treppe krabbelnd hochklettern", "en": "Crawling up stairs", "tip_de": "Immer mit Begleitung, rückwärts runter üben", "tip_en": "Always supervised, practice going down backwards"}, {"id": "motor-012", "area": "motor", "from": 12, "to": 24, "de": "Barfuß auf verschiedenen Untergründen", "en": "Barefoot on different surfaces", "tip_de": "Gras, Sand, Kies, Teppich – Füße trainieren mit", "tip_en": "Grass, sand, gravel, rug – trains the feet too"}, {"id": "motor-013", "area": "motor", "from": 12, "to": 24, "de": "Bälle rollen und werfen", "en": "Rolling and throwing balls", "tip_de": "Weiche Bälle, gegenseitig zurollen", "tip_en": "Soft balls, roll them back and forth"}, {"id": "motor-014", "area": "motor", "from": 14, "to": 30, "de": "Bobbycar / Rutschauto", "en": "Ride-on car", "tip_de": "Abstoßen stärkt Beine und Gleichgewicht", "tip_en": "Pushing off builds legs and balance"}, {"id": "motor-015", "area": "motor", "from": 15, "to": 30, "de": "Klettern auf kleinen Spielplatzgerüsten", "en": "Climbing small playground frames", "tip_de": "Eigene Grenzen finden lassen, in der Nähe bleiben", "tip_en": "Let them find their limits, stay close"}, {"id": "motor-016", "area": "motor", "from": 18, "to": 30, "de": "Tanzen zu Musik", "en": "Dancing to music", "tip_de": "Stopp-Tanz: einfrieren, wenn die Musik aufhört", "tip_en": "Freeze dance: stop when the music stops"}, {"id": "motor-017", "area": "motor", "from": 18, "to": 36, "de": "Treppen gehen an der Hand", "en": "Walking up stairs holding hands", "tip_de": "Erst Nachstellschritt, später abwechselnd", "tip_en": "First one step at a time, later alternating feet"}, {"id": "motor-018", "area": "motor", "from": 20, "to": 40, "de": "Laufrad ausprobieren", "en": "Try a balance bike", "tip_de": "Sattel so tief, dass beide Füße flach aufsetzen", "tip_en": "Saddle low enough for both feet to be flat"}, {"id": "motor-019", "area": "motor", "from": 24, "to": 42, "de": "Hüpfen mit beiden Füßen", "en": "Jumping with both feet", "tip_de": "Von der untersten Stufe oder über ein Seil am Boden", "tip_en": "Off the bottom step or over a rope on the ground"}, {"id": "motor-020", "area": "motor", "from": 24, "to": 48, "de": "Eltern-Kind-Turnen", "en": "Parent-and-child gym", "tip_de": "Feste Gruppe, viel Bewegung, andere Kinder", "tip_en": "A regular group, lots of movement, other kids"}, {"id": "motor-021", "area": "motor", "from": 30, "to": 54, "de": "Balancieren", "en": "Balancing", "tip_de": "Bordstein, Baumstamm, Seil am Boden", "tip_en": "Kerb, tree trunk, a rope on the ground"}, {"id": "motor-022", "area": "motor", "from": 30, "to": 60, "de": "Fangen und Werfen mit großem Ball", "en": "Catching and throwing a big ball", "tip_de": "Erst aus kurzer Distanz, Arme vorstrecken", "tip_en": "Start close, arms stretched out"}, {"id": "motor-023", "area": "motor", "from": 36, "to": 60, "de": "Kinderturnen", "en": "Kids gymnastics", "tip_de": "Rollen, Klettern, Springen in der Gruppe", "tip_en": "Rolling, climbing, jumping in a group"}, {"id": "motor-024", "area": "motor", "from": 36, "to": 60, "de": "Selbst anschwingen auf der Schaukel", "en": "Swinging by themselves", "tip_de": "Beine vor und zurück – erst mit kleinem Schubs", "tip_en": "Legs forward and back – start with a small push"}, {"id": "motor-025", "area": "motor", "from": 40, "to": 66, "de": "Roller fahren", "en": "Riding a scooter", "tip_de": "Mit Helm, erst auf ruhigen Wegen", "tip_en": "With a helmet, start on quiet paths"}, {"id": "motor-026", "area": "motor", "from": 42, "to": 72, "de": "Fahrrad ohne Stützräder", "en": "Bike without training wheels", "tip_de": "Nach dem Laufrad geht es oft ganz schnell", "tip_en": "After a balance bike it often happens quickly"}, {"id": "motor-027", "area": "motor", "from": 48, "to": 72, "de": "Schwimmkurs (Seepferdchen)", "en": "Swimming course (beginner badge)", "tip_de": "Kurse sind oft lange im Voraus ausgebucht", "tip_en": "Courses are often booked out far in advance"}, {"id": "motor-028", "area": "motor", "from": 48, "to": 72, "de": "Klettern oder Bouldern für Kinder", "en": "Climbing or bouldering for kids", "tip_de": "Kinderkurse in der Kletterhalle", "tip_en": "Kids' sessions at a climbing gym"}, {"id": "motor-029", "area": "motor", "from": 48, "to": 72, "de": "Hüpfkästchen und einbeinig hüpfen", "en": "Hopscotch and hopping on one leg", "tip_de": "Mit Kreide auf den Gehweg malen", "tip_en": "Draw it with chalk on the pavement"}, {"id": "motor-030", "area": "motor", "from": 54, "to": 72, "de": "Seilspringen ausprobieren", "en": "Try skipping rope", "tip_de": "Erst über ein schwingendes Seil springen", "tip_en": "Start by jumping over a swinging rope"}, {"id": "motor-031", "area": "motor", "from": 54, "to": 72, "de": "Ballsport schnuppern", "en": "Try a ball sport", "tip_de": "Kinderfußball oder Ballschule im Verein", "tip_en": "Kids' football or a ball school at a club"}, {"id": "motor-032", "area": "motor", "from": 56, "to": 72, "de": "Inliner oder Eislaufen", "en": "Inline skating or ice skating", "tip_de": "Mit Schutzausrüstung, an der Hand starten", "tip_en": "With protective gear, start holding hands"}, {"id": "lang-033", "area": "lang", "from": 0, "to": 6, "de": "Den Alltag kommentieren", "en": "Narrate the day", "tip_de": "Beim Wickeln und Anziehen erzählen, was passiert", "tip_en": "Talk about what's happening while changing and dressing"}, {"id": "lang-034", "area": "lang", "from": 0, "to": 6, "de": "Reime und Verse summen", "en": "Hum rhymes and verses", "tip_de": "Melodie und Rhythmus beruhigen und üben Laute", "tip_en": "Melody and rhythm soothe and practise sounds"}, {"id": "lang-035", "area": "lang", "from": 0, "to": 8, "de": "Lieder und Wiegenlieder", "en": "Songs and lullabies", "tip_de": "Immer wieder dieselben – Wiederholung hilft", "tip_en": "The same ones again and again – repetition helps"}, {"id": "lang-036", "area": "lang", "from": 2, "to": 9, "de": "Brabbeln nachahmen", "en": "Imitate babbling", "tip_de": "Laute zurückgeben, Pausen zum Antworten lassen", "tip_en": "Echo the sounds, leave pauses for a reply"}, {"id": "lang-037", "area": "lang", "from": 4, "to": 12, "de": "Kontrast- und Stoffbücher", "en": "Contrast and cloth books", "tip_de": "Zum Anschauen, Anfassen und In-den-Mund-Nehmen", "tip_en": "To look at, touch and mouth"}, {"id": "lang-038", "area": "lang", "from": 6, "to": 15, "de": "Fingerspiele und Kniereiter", "en": "Finger plays and knee rides", "tip_de": "„Hoppe hoppe Reiter“ & Co.", "tip_en": "Classic knee-bouncing rhymes"}, {"id": "lang-039", "area": "lang", "from": 8, "to": 18, "de": "Zeigen und benennen", "en": "Point and name", "tip_de": "„Wo ist der Ball?“ – auf Zeigen mit Worten antworten", "tip_en": "“Where's the ball?” – answer pointing with words"}, {"id": "lang-040", "area": "lang", "from": 10, "to": 24, "de": "Bilderbücher mit Klappen", "en": "Lift-the-flap books", "tip_de": "Kurz, robust, viel zum Entdecken", "tip_en": "Short, sturdy, lots to discover"}, {"id": "lang-041", "area": "lang", "from": 12, "to": 24, "de": "Wörter erweitern", "en": "Expand on words", "tip_de": "Kind sagt „Auto“ – „Ja, ein rotes Auto!“", "tip_en": "Child says “car” – “Yes, a red car!”"}, {"id": "lang-042", "area": "lang", "from": 15, "to": 30, "de": "Tiergeräusche und Wortspiele", "en": "Animal sounds and word games", "tip_de": "„Wie macht die Kuh?“ – Lachen erlaubt", "tip_en": "“What does the cow say?” – laughing allowed"}, {"id": "lang-043", "area": "lang", "from": 18, "to": 36, "de": "Vorlese-Ritual vor dem Schlafen", "en": "Bedtime reading ritual", "tip_de": "Jeden Abend, gern dasselbe Buch", "tip_en": "Every evening, the same book is fine"}, {"id": "lang-044", "area": "lang", "from": 20, "to": 36, "de": "Zwei-Wort-Sätze aufgreifen", "en": "Pick up two-word sentences", "tip_de": "Nicht korrigieren, richtig wiederholen", "tip_en": "Don't correct, repeat it correctly"}, {"id": "lang-045", "area": "lang", "from": 24, "to": 42, "de": "Reime und Abzählverse", "en": "Rhymes and counting-out verses", "tip_de": "Reime schulen das Hören von Lauten", "tip_en": "Rhymes train hearing sounds"}, {"id": "lang-046", "area": "lang", "from": 24, "to": 48, "de": "Besuch in der Bücherei", "en": "Visit to the library", "tip_de": "Kinderecke, eigene Bücher aussuchen lassen", "tip_en": "Children's corner, let them pick books"}, {"id": "lang-047", "area": "lang", "from": 30, "to": 54, "de": "Beim Vorlesen Fragen stellen", "en": "Ask questions while reading", "tip_de": "„Was passiert wohl als Nächstes?“", "tip_en": "“What do you think happens next?”"}, {"id": "lang-048", "area": "lang", "from": 36, "to": 60, "de": "Geschichten nacherzählen lassen", "en": "Let them retell stories", "tip_de": "Mit Bildern als Stütze", "tip_en": "With pictures as prompts"}, {"id": "lang-049", "area": "lang", "from": 36, "to": 60, "de": "Hörspiele und Hörbücher", "en": "Audio stories and audiobooks", "tip_de": "Gemeinsam hören, danach darüber reden", "tip_en": "Listen together, talk about it afterwards"}, {"id": "lang-050", "area": "lang", "from": 42, "to": 72, "de": "Buchstaben im Alltag entdecken", "en": "Spot letters in everyday life", "tip_de": "Mit dem eigenen Namen anfangen", "tip_en": "Start with their own name"}, {"id": "lang-051", "area": "lang", "from": 48, "to": 72, "de": "Silben klatschen", "en": "Clap syllables", "tip_de": "„Ba-na-ne“ – drei Klatscher", "tip_en": "“Ba-na-na” – three claps"}, {"id": "lang-052", "area": "lang", "from": 48, "to": 72, "de": "Witze und Rätsel erfinden", "en": "Make up jokes and riddles", "tip_de": "Sprachwitz macht Spaß und fördert", "tip_en": "Wordplay is fun and builds skills"}, {"id": "lang-053", "area": "lang", "from": 54, "to": 72, "de": "Anlaute raten", "en": "Guess the first sound", "tip_de": "„Was beginnt mit M?“ – Mama, Maus, Mond", "tip_en": "“What starts with M?” – mum, mouse, moon"}, {"id": "lang-054", "area": "lang", "from": 60, "to": 72, "de": "Erste Wörter malen und schreiben", "en": "Draw and write first words", "tip_de": "Ohne Druck – Schreiben wie es klingt ist okay", "tip_en": "No pressure – writing as it sounds is fine"}, {"id": "social-055", "area": "social", "from": 0, "to": 6, "de": "Viel Körperkontakt und Tragen", "en": "Lots of body contact and carrying", "tip_de": "Nähe gibt Sicherheit – verwöhnen gibt es hier nicht", "tip_en": "Closeness gives security – you can't spoil a baby"}, {"id": "social-056", "area": "social", "from": 0, "to": 8, "de": "Mimik spiegeln", "en": "Mirror facial expressions", "tip_de": "Lächeln erwidern, Gesichter machen", "tip_en": "Smile back, make faces"}, {"id": "social-057", "area": "social", "from": 0, "to": 12, "de": "Feste Abendroutine mit Nähe", "en": "A cosy fixed bedtime routine", "tip_de": "Gleiche Abfolge gibt Halt", "tip_en": "The same sequence gives security"}, {"id": "social-058", "area": "social", "from": 3, "to": 10, "de": "Guck-guck-Spiele", "en": "Peekaboo", "tip_de": "Weg und wieder da – Grundlage für Vertrauen", "tip_en": "Gone and back again – a basis for trust"}, {"id": "social-059", "area": "social", "from": 6, "to": 14, "de": "Fremdeln begleiten", "en": "Support stranger anxiety", "tip_de": "Neue Menschen langsam kennenlernen, auf dem Arm", "tip_en": "Meet new people slowly, from your arms"}, {"id": "social-060", "area": "social", "from": 8, "to": 18, "de": "Krabbel- oder Spielgruppe", "en": "Toddler or playgroup", "tip_de": "Andere Kinder erleben, Eltern vernetzen sich", "tip_en": "Experience other kids, parents connect"}, {"id": "social-061", "area": "social", "from": 10, "to": 24, "de": "Geben-und-Nehmen-Spiele", "en": "Give-and-take games", "tip_de": "„Danke!“ – und zurückgeben", "tip_en": "“Thank you!” – and give it back"}, {"id": "social-062", "area": "social", "from": 12, "to": 30, "de": "Gefühle benennen", "en": "Name feelings", "tip_de": "„Du bist wütend, weil …“", "tip_en": "“You're angry because …”"}, {"id": "social-063", "area": "social", "from": 15, "to": 30, "de": "Kuscheltier versorgen", "en": "Care for a soft toy", "tip_de": "Füttern, ins Bett bringen, trösten", "tip_en": "Feed it, put it to bed, comfort it"}, {"id": "social-064", "area": "social", "from": 18, "to": 36, "de": "Begegnungen auf dem Spielplatz begleiten", "en": "Support playground encounters", "tip_de": "Nicht sofort eingreifen, aber nah sein", "tip_en": "Don't step in at once, but stay close"}, {"id": "social-065", "area": "social", "from": 24, "to": 42, "de": "Abwechseln üben", "en": "Practise taking turns", "tip_de": "Rutsche, Würfelspiel, „Jetzt du, dann ich“", "tip_en": "Slide, dice games, “you, then me”"}, {"id": "social-066", "area": "social", "from": 24, "to": 48, "de": "Rollenspiele", "en": "Pretend play", "tip_de": "Kaufladen, Arztkoffer, Kochen", "tip_en": "Play shop, doctor's kit, cooking"}, {"id": "social-067", "area": "social", "from": 30, "to": 54, "de": "Gefühlskarten und Gefühlsbücher", "en": "Feelings cards and books", "tip_de": "Beim Abendessen: Wie war dein Tag?", "tip_en": "At dinner: how was your day?"}, {"id": "social-068", "area": "social", "from": 36, "to": 60, "de": "Verabredung mit einem Freund oder einer Freundin", "en": "Play date with a friend", "tip_de": "Erst bei euch, später auch woanders", "tip_en": "First at your place, later elsewhere too"}, {"id": "social-069", "area": "social", "from": 36, "to": 72, "de": "Streit lösen üben", "en": "Practise resolving conflicts", "tip_de": "Gemeinsam Lösungen suchen statt Schuld", "tip_en": "Look for solutions together instead of blame"}, {"id": "social-070", "area": "social", "from": 42, "to": 72, "de": "Familienregeln gemeinsam aufstellen", "en": "Set family rules together", "tip_de": "Wenige, klare Regeln – aufmalen", "tip_en": "Few, clear rules – draw them"}, {"id": "social-071", "area": "social", "from": 48, "to": 72, "de": "Übernachtung bei Großeltern oder Freunden", "en": "Sleepover at grandparents or friends", "tip_de": "Kuscheltier und Abendritual mitnehmen", "tip_en": "Bring the soft toy and the bedtime routine"}, {"id": "social-072", "area": "social", "from": 48, "to": 72, "de": "Verlieren lernen bei Gesellschaftsspielen", "en": "Learn to lose at board games", "tip_de": "Gefühle aushalten, gute Verlierer loben", "tip_en": "Sit with the feelings, praise good losers"}, {"id": "social-073", "area": "social", "from": 54, "to": 72, "de": "Kleine Verantwortung übernehmen", "en": "Take on small responsibilities", "tip_de": "Pflanze gießen, Haustier füttern", "tip_en": "Water a plant, feed a pet"}, {"id": "social-074", "area": "social", "from": 60, "to": 72, "de": "Hilfsbereitschaft stärken", "en": "Encourage helpfulness", "tip_de": "Jüngeren helfen, Kita-Aufgaben übernehmen", "tip_en": "Help younger kids, take on daycare tasks"}, {"id": "mind-075", "area": "mind", "from": 0, "to": 4, "de": "Schwarz-Weiß-Kontraste anschauen", "en": "Look at black-and-white contrasts", "tip_de": "Starke function bindOrbit(v) {
  const orbit = v.querySelector(".orbit");
  if (!orbit) return;
  orbit.querySelectorAll(".planet").forEach(p => p.onpointerdown = e => {
    const id = p.dataset.go.slice(2), start = {x: e.clientX, y: e.clientY};
    let dragging = false, target = null;
    const slotAt = (x, y) => { const r = orbit.getBoundingClientRect(), dx = x - r.left - r.width / 2, dy = y - r.top - r.height / 2;

// All deadlines in one list: manual ones plus those generated from contracts and documents.
function radarItems() {
  const ta = TA[lang], out = [];
  ADMIN.deadlines.forEach(d => out.push({id: d.id, src: "manual", ref: d, t: d.t, due: parse(d.due), o: d.o, kind: d.kind,
    remind: d.remind, repeat: d.repeat, note: d.note, done: d.status === "done"}));
  ADMIN.contracts.forEach(c => {
    if (!c.end || !c.notice) return;
    let end = parse(c.end), due = addMonths(end, -c.notice);
    while (due < TODAY && !ADMIN.handled[`${c.id}@${iso(due)}`]) { end = addMonths(end, 12); due = addMonths(end, -c.notice); }  // window missed → contract renewed
    const n = both(c.name), key = `${c.id}@${iso(due)}`;
    out.push({id: `c-${c.id}`, src: "contract", ref: c, key, t: L(TA.de.cancelOrKeep(n.de), TA.en.cancelOrKeep(n.en)), due, o: c.o, kind: "cancel", remind: 30, repeat: "none", done: !!ADMIN.handled[key]});
  });
  ADMIN.docs.forEach(p => {
    if (!p.valid) return;
    const n = both(p.name), due = parse(p.valid), key = `${p.id}@${p.valid}`;
    out.push({id: `p-${p.id}`, src: "doc", ref: p, key, t: L(TA.de.expires(n.de), TA.en.expires(n.en)), due, o: p.o, kind: "renew", remind: 56, repeat: "none", note: p.note, done: !!ADMIN.handled[key]});
  });
  return out.sort((a, b) => a.due - b.due);
}

const step = (d, f) => f === "monthly" ? addMonths(d, 1) : addDays(d, FREQ_DAYS[f]);
const openChores = () => HOME.chores.filter(c => !c.done);

function completeChore(c) {
  HOME.log.push([me(), iso(TODAY), effortOf(c)]);
  if (c.freq === "once") { c.done = iso(TODAY); return; }
  let n = parse(c.next);
  do n = step(n, c.freq); while (n <= TODAY);
  c.next = iso(n);
  if (c.o === "R") c.cur = c.cur === "A" ? "N" : "A";
}
function choreOwner(c) {

}

    <button class="docedit" data-act="editChore" data-id="${c.id}"><span class="dmain"><span class="t">${esc(tx(c.t))}</span>
    <span class="m">${th.freq[c.freq]}${c.note && tx(c.note) ? " · " + esc(tx(c.note)) : ""}</span></span></button>
    <span class="dside">${choreOwner(c)}${checked ? "" : dayDiff(due) > 0 ? chip(dayDiff(due) <= 6 ? longDate(due) : fmt(due), "var(--muted)") : dayDiff(due) < 0 ? dueChip({due}) : ""}</span></div>`;

function vTasks() {

  openChores().filter(mineOnly).sort((a, b) => a.next.localeCompare(b.next)).forEach(c => { const n = dayDiff(parse(c.next));
    groups[n < 0 ? "overdue" : n === 0 ? "today" : n <= 7 ? "week" : "later"].push(c); });
  const doneOnce = HOME.chores.filter(c => c.done);
  const monday = addDays(TODAY, -((TODAY.getDay() + 6) % 7)), wk = HOME.log.filter(([, d]) => parse(d) >= monday);
  const ptsOf = p => wk.filter(([q]) => q === p).reduce((s, [, , e]) => s + (e || 2), 0), a = ptsOf("A"), n = ptsOf("N"), pa = a + n ? Math.round(a / (a + n) * 100) : 50;

const perWeekTxt = n => (Math.round(n * 10) / 10).toLocaleString(lang === "de" ? "de-DE" : "en-GB");
function vPlan() {

  const A = pts("A") + (pts("R") + pts("AN")) / 2, N = pts("N") + (pts("R") + pts("AN")) / 2, pa = A + N ? Math.round(A / (A + N) * 100) : 50;

function bindHome(v) {

const fmtDT = s => { const d = new Date(s); return `${fmt(d)} ${d.toLocaleTimeString(lang === "de" ? "de-DE" : "en-GB", {hour: "2-digit", minute: "2-digit"})}`; };

// One list of everything health-related that is still open: generated check-ups plus manual appointments.
function healthItems() {
  const out = [];
  Object.entries(KIDS).forEach(([kid, k]) => U_SCHEDULE.forEach(([u, a, b]) => {
    const from = addMonths(k.born, a), to = addMonths(k.born, b), key = `${kid}:${u}`, s = HEALTH.u[key] || {};
    const state = s.state || (to < TODAY ? "done" : "open");
    if (state === "done" || dayDiff(from) > 400) return;
    out.push({id: `u-${key}`, src: "u", key, who: kid, t: L(`${u} ${k.name}`, `${u} ${k.name}`), kind: "checkup", due: from, until: to,
      booked: s.booked || "", state: s.booked && state === "open" ? "booked" : state, o: s.o || "AN"});
  }));
  HEALTH.appts.filter(m => !m.done).forEach(m => { const g = !m.booked && gcalMatch(m.t), booked = m.booked || (g ? `${g.date}T${g.time || "00:00"}` : "");
    out.push({id: m.id, src: "appt", ref: m, who: m.who, t: m.t, kind: m.kind, due: parse(m.due), gcal: g ? g.id : "",
    booked, state: booked ? "booked" : "open", o: m.o, repeat: m.repeat, note: m.note}); });
  return out;
}
const hGroup = i => i.state === "unknown" || (i.state === "open" && (i.until ? i.until : i.due) < TODAY) ? "check"
  : i.state === "booked" ? "booked" : dayDiff(i.due) <= 90 ? "todo" : "later";
const hWhen = i => { const tg = TG[lang];
  if (i.state === "booked") return chip(tg.bookedAt(fmtDT(i.booked)), "var(--active)");
  if (hGroup(i) === "check") return chip(i.state === "unknown" ? tg.doneQ : T[lang].check, "var(--warn)");
  return dayDiff(i.due) > 0 ? chip(tg.from(fmt(i.due) + (i.due.getFullYear() !== TODAY.getFullYear() ? " " + i.due.getFullYear() : "")), "var(--muted)") : dueChip({due: i.until || i.due}); };

function healthTabs(active) {
  const tg = TG[lang];
  return `<nav class="tabs">${[["", tg.appts], ["profiles", tg.profiles], ["doctors", tg.doctors]].map(([k, l]) =>
    `<a href="#/health${k ? "/" + k : ""}" class="${k === active ? "on" : ""}">${l}</a>`).join("")}</nav>`;
}
function vHealth(r) {
  const d = DOM.health, top = hero(ic("health"), d.c, tx(d.name), tx(d.desc)) + healthTabs(r[1] || "");
  const foot = `<p class="hint">${TG[lang].sensitive} <button class="linkbtn" data-act="resetHealth">${TA[lang].reset}</button></p>`;
  return top + (r[1] === "profiles" ? vProfiles() : r[1] === "doctors" ? vDoctors() : vAppts()) + foot;
}
function vAppts() {
  const tg = TG[lang], groups = {check: [], booked: [], todo: [], later: []};
  healthItems().sort((a, b) => (a.booked || iso(a.due)).localeCompare(b.booked || iso(b.due))).forEach(i => groups[hGroup(i)].push(i));
  return `<div class="toolbar"><button class="btn primary" data-act="addAppt">${tg.addAppt}</button></div>
    ${Object.values(groups).some(g => g.length) ? "" : `<p class="empty">${tg.nothing}</p>`}
    ${Object.entries(groups).filter(([, l]) => l.length).map(([g, l]) => `<section class="dgroup ${g === "check" ? "overdue" : ""}"><h4>${tg.g[g]} <span>${l.length}</span></h4>${l.map(i => `
      <div class="drow chore"><button class="check" data-act="doneHealth" data-id="${i.id}" aria-label="✓"></button>
      <button class="docedit" data-act="editHealth" data-id="${i.id}"><span class="dmain"><span class="t">${esc(tx(i.t))}</span>
      <span class="m">${personName(i.who)} · ${tg.kinds[i.kind]}${i.until ? " · " + tg.window(fmt(i.due), fmt(i.until) + " " + i.until.getFullYear()) : ""}${i.src === "appt" && i.repeat ? " · " + tg.repeats[i.repeat] : ""}</span></span>
      <span class="dside">${i.gcal ? `<span class="gbadge" title="Google Kalender">G</span>` : ""}${ownerTag(i.o)}${hWhen(i)}</span></button></div>`).join("")}</section>`).join("")}`;
}
function vProfiles() {

function bindHealth(v) {
  const tg = TG[lang], f = tg.f, whos = {A: FAM.p1, N: FAM.p2, ...KIDN()};
  const apptForm = () => [{k: "t", label: f.t, req: true}, {k: "who", label: f.who, type: "select", options: whos}, {k: "kind", label: f.kind, type: "select", options: tg.kinds},
    {k: "due", label: f.due, type: "date", req: true}, {k: "booked", label: f.booked, type: "datetime-local"}, {k: "repeat", label: f.repeat, type: "select", options: tg.repeats},
    {k: "o", label: f.o, type: "select", options: TA[lang].owners}, {k: "note", label: f.note}];
  const uForm = () => [{k: "state", label: f.state, type: "select", options: {open: tg.states.open, unknown: tg.states.unknown, done: tg.states.done}},
    {k: "booked", label: f.booked, type: "datetime-local"}, {k: "o", label: f.o, type: "select", options: TA[lang].owners}];
  const docForm = () => [{k: "name", label: f.name, req: true}, {k: "spec", label: f.spec}, {k: "phone", label: f.phone, type: "tel"}, {k: "addr", label: f.addr}, {k: "for", label: f.for, type: "select", options: tg.forOpts}];
  const find = id => healthItems().find(i => i.id === id);
  v.querySelectorAll("[data-act]").forEach(b => b.onclick = e => {
    const act = b.dataset.act, id = b.dataset.id;
    if (act !== "resetHealth") e.preventDefault();
    switch (act) {
      case "doneHealth": { const i = find(id);
        if (i.src === "u") HEALTH.u[i.key] = {...(HEALTH.u[i.key] || {}), state: "done"};
        else if (+i.repeat) { /* next one counts from when it actually happened */ const m = i.ref, base = m.booked ? new Date(m.booked) : TODAY; m.due = iso(addMonths(base, +m.repeat)); m.booked = ""; }
        else i.ref.done = iso(TODAY);
        saveHealth(); return render(); }
      case "editHealth": { const i = find(id);
        if (i.src === "u") return openForm(tx(i.t), uForm(), {state: i.state === "booked" ? "open" : i.state, booked: i.booked, o: i.o},
          val => { HEALTH.u[i.key] = {state: val.state, booked: val.booked, o: val.o}; });
        const m = i.ref;
        return openForm(TA[lang].edit, apptForm(), {...m, t: plain(m.t), note: plain(m.note)}, val => Object.assign(m, val, {repeat: +val.repeat}),
          () => HEALTH.appts.splice(HEALTH.appts.indexOf(m), 1)); }
      case "addAppt": return openForm(tg.newAppt, apptForm(), {who: "A", kind: "doctor", due: iso(TODAY), repeat: 0, o: me()},
        val => HEALTH.appts.push({id: "u" + Date.now(), ...val, repeat: +val.repeat}));
      case "editProfile": { const p = HEALTH.profiles[id] = HEALTH.profiles[id] || {};
        const fields = [{k: "blood", label: f.blood}, {k: "allergies", label: f.allergies}, {k: "meds", label: f.meds}, {k: "insurance", label: f.insurance}];
        if (KIDS[id]) fields.push({k: "height", label: f.height}, {k: "weight", label: f.weight}, {k: "measured", label: f.measured, type: "date"});
        fields.push({k: "notes", label: f.notes});
        return openForm(personName(id), fields, Object.fromEntries(fields.map(x => [x.k, plain(p[x.k])])), val => Object.assign(p, val)); }
      case "addDoctor": return openForm(tg.newDoc, docForm(), {for: "fam"}, val => HEALTH.doctors.push({id: "u" + Date.now(), ...val}));
      case "editDoctor": { const d = HEALTH.doctors.find(x => x.id === id);
        return openForm(TA[lang].edit, docForm(), {...d, spec: plain(d.spec)}, val => Object.assign(d, val), () => HEALTH.doctors.splice(HEALTH.doctors.indexOf(d), 1)); }
      case "resetHealth": if (confirm(TA[lang].resetQ)) { HEALTH = HEALTH_EXAMPLES(); saveHealth(); render(); } return;
    }
  });
}

      case "addGoal": return openForm(tz.newGoal, goalForm(), {horizon: String(TODAY.getFullYear() + 1), o: "AN"}, val => GOALS.goals.push({id: "u" + Date.now(), ...val, steps: []}));
      case "editGoal": return openForm(TA[lang].edit, goalForm(), {...g, t: plain(g.t), why: plain(g.why), horizon: plain(g.horizon)}, val => Object.assign(g, val));
      case "delGoal": GOALS.goals = GOALS.goals.filter(x => x !== g); saveGoals(); return go("#/goals");
      case "achieveGoal": g.status = "done"; g.doneAt = iso(TODAY); saveGoals(); return render();
      case "reopenGoal": g.status = "active"; delete g.doneAt; saveGoals(); return render();
      case "toggleStep": { const s = g.steps.find(x => x.id === id); s.done = !s.done; saveGoals(); return render(); }
      case "delStep": g.steps = g.steps.filter(x => x.id !== id); saveGoals(); return render();
      case "addDream": return openForm(tz.newDream, dreamForm(), {cat: "experience", who: "fam", status: "idea"}, val => GOALS.bucket.push({id: "u" + Date.now(), ...val, doneAt: val.status === "done" ? iso(TODAY) : undefined}));
      case "editDream": { const d = GOALS.bucket.find(x => x.id === id);
        return openForm(TA[lang].edit, dreamForm(), {...d, t: plain(d.t), when: plain(d.when)}, val => {
          // A dream that just came true also lands in the memories.
          if (val.status === "done" && d.status !== "done") { d.doneAt = iso(TODAY); GOALS.memories.push({id: "u" + Date.now(), date: d.doneAt, t: val.t, text: "", who: val.who, link: ""}); }
          Object.assign(d, val); }, () => GOALS.bucket.splice(GOALS.bucket.indexOf(d), 1)); }
      case "addMemory": return openForm(tz.newMemory, memForm(), {date: iso(TODAY), who: "fam"}, val => GOALS.memories.push({id: "u" + Date.now(), ...val}));
      case "editMemory": { const m = GOALS.memories.find(x => x.id === id);
        return openForm(TA[lang].edit, memForm(), {...m, t: plain(m.t), text: plain(m.text)}, val => Object.assign(m, val), () => GOALS.memories.splice(GOALS.memories.indexOf(m), 1)); }
      case "resetGoals": if (confirm(TA[lang].resetQ)) { GOALS = GOALS_EXAMPLES(); saveGoals(); render(); } return;
    }
  });
  const sf = v.querySelector("#stepform");
  if (sf) sf.onsubmit = e => { e.preventDefault(); const t = sf.elements.namedItem("t").value.trim(); if (!t) return;
    g.steps.push(st(t, false)); saveGoals(); render(); v.querySelector("#stepform input")?.focus(); };
}

function finSummary() {
  const inc = a => FIN.incomes.filter(i => i.who === a).reduce((s, i) => s + (+i.amount || 0), 0);
  const fixed = fixedItems(), fx = a => fixed.filter(x => x.acct === a).reduce((s, x) => s + monthly(x), 0);
  const sav = FIN.savings.reduce((s, v) => s + (+v.rate || 0), 0), daily = +FIN.settings.daily || 0;
  const incA = inc("A"), incN = inc("N"), kg = inc("joint"), total = incA + incN + kg;
  const jointNeed = fx("joint") + sav + daily, fromParents = Math.max(0, jointNeed - kg);
  const shareA = FIN.settings.split === "equal" ? 0.5 : (incA + incN ? incA / (incA + incN) : 0.5);
  const payA = fromParents * shareA, payN = fromParents - payA;
  const fixedAll = fixed.reduce((s, x) => s + monthly(x), 0);
  return {total, incA, incN, kg, fixedAll, fixedJoint: fx("joint"), sav, daily, jointNeed, payA, payN, shareA,
    keepA: incA - payA - fx("A"), keepN: incN - payN - fx("N"), rest: total - fixedAll - sav - daily};
}

const saveKids = () => { try { FOMStore.setItem(KIDS_KEY, JSON.stringify(KD)); } catch (e) {} };
// Older code reads KIDS[kid].topics; keep that working on top of the editable store.
Object.keys(KIDS).forEach(k => Object.defineProperty(KIDS[k], "topics", {get: () => KD.topics.filter(t => t.kid === k), configurable: true}));

const ageMonths = b => { let m = (TODAY.getFullYear() - b.getFullYear()) * 12 + TODAY.getMonth() - b.getMonth(); if (TODAY.getDate() < b.getDate()) m--; return m; };
const lastKidCheck = kid => KD.checks.filter(c => c.kid === kid).sort((a, b) => b.date.localeCompare(a.date))[0];

const kidCheckDue = kid => nextKidCheck(kid) <= TODAY;
// Idea catalog (catalog/ideen-katalog.json, built by tools/build_catalog.py). Until it has loaded, the small built-in list is used.
let CATALOG = null;
CATALOG = window.FOS_CATALOG || null;
const catalogIdeas = () => CATALOG ? CATALOG.ideas : IDEA_LIB.map(([from, to, area, de, en], i) => ({id: "lib" + i, area, from, to, de, en, tip_de: "", tip_en: ""}));
// Ideas for a given age month: per area up to `per`, the ones that just became relevant first.
const ideasAt = (m, per = 4, skip = new Set()) => {
  const out = {}; Object.keys(AREAS).forEach(a => out[a] = catalogIdeas().filter(i => i.area === a && i.from <= m && m < i.to && !skip.has(norm(i.de)) && !skip.has(norm(i.en)))
    .sort((x, y) => y.from - x.from || (x.to - x.from) - (y.to - y.from)).slice(0, per)); return out; };
const ideasFor = (kid, per = 4) => ideasAt(ageMonths(KIDS[kid].born), per, new Set(KD.topics.filter(t => t.kid === kid).map(t => norm(tx(t.t)))));

const schedTxt = t => t.day !== "" && t.day != null ? `${TW[lang].days[t.day].slice(0, 2)}${t.time ? " " + t.time : ""}` : "";
const mIcon = m => `<span class="mic">${TK[lang].mIcon[m.type]}</span>`;

}

}
function vKidsRoute(r) {
  if (!r[1]) return vKidsHome();

  if (r[1] === "catalog") return vCatalog(r[2]);
  const kid = r[1], sub = r[2] || "";
  if (AREAS[sub]) return vKidArea(kid, sub);
  if (sub === "checkrun") return vKidCheckRun(kid);
  if (sub === "checklog") return vKidCheckLog(kid, r[3]);
  const k = KIDS[kid], top = hero(k.name[0], k.c, k.name, `${ageStr(k.born)} · ${tx(DOM.kids.name)}`, true) + kidTabs(kid, sub);
  return top + (sub === "topics" ? vKidTopics(kid) : sub === "moments" ? vKidMoments(kid) : sub === "check" ? vKidCheck(kid) : vKidOverview(kid))

        ${lm ? `<p class="kc-moment">${mIcon(lm)} ${esc(tx(lm.t))} <span class="muted">· ${fmt(parse(lm.date))}</span></p>` : ""}
        <p class="kc-check ${kidCheckDue(id) ? "due" : ""}">${kidCheckDue(id) ? tk.checkDue : tk.checkNext(fmt(nextKidCheck(id)) + " " + nextKidCheck(id).getFullYear())}</p></a>`; }).join("")}</div>

      <section class="sec"><h3>${tk.languages}</h3>${(KD.languages[kid] || []).map(x => `<div class="item"><div><div class="t">${esc(x.l)}</div><div class="m">${esc(tx(x.level))} · ${esc(tx(x.src))}</div></div></div>`).join("") || `<p class="empty">${tk.langNone}</p>`}

      <div class="cat-row"><span class="m">${tk.catFor}</span><div class="seg mini">${Object.entries(KIDS).map(([id, k]) => `<button class="${catKid === id ? "on" : ""}" data-act="catKid" data-id="${id}">${k.name}</button>`).join("")}</div></div>
      <p class="m">${tk.catHint}</p></section>
    <div class="cols">${Object.keys(AREAS).map(a => `<section class="sec"><h3>${tx(AREAS[a])}</h3>${per[a].map(i => `<div class="cat-idea">
      ${have.has(norm(i.de)) || have.has(norm(i.en)) ? `<button class="taken" disabled title="${KIDS[catKid].name}">✓</button>` : `<button data-act="takeIdea" data-id="${catKid}|${i.area}|${i.de}|${i.en}">+</button>`}<div><div class="t">${lang === "de" ? i.de : i.en}${i.from === m ? ` <span class="chip" style="--k:var(--active)">${tk.catNew}</span>` : ""}</div>
      <div class="m">${esc(lang === "de" ? i.tip_de : i.tip_en)} · ${i.from}–${i.to - 1} ${lang === "de" ? "Mon." : "mo"}</div></div></div>`).join("") || `<p class="empty">–</p>`}</section>`).join("")}</div>`;
}
function bindKids(v, r) {
  const tk = TK[lang], f = tk.f, kidOpts = Object.fromEntries(Object.entries(KIDS).map(([id, k]) => [id, k.name]));
  const days = {"": "–", ...Object.fromEntries(TW[lang].days.map((d, i) => [i, d]))}, areas = Object.fromEntries(Object.entries(AREAS).map(([k, l]) => [k, tx(l)]));
  const topicForm = () => [{k: "t", label: f.t, req: true}, {k: "a", label: f.a, type: "select", options: areas}, {k: "s", label: f.s, type: "select", options: {active: tk.status.active, planned: tk.status.planned, idea: tk.status.idea, paused: tk.status.paused}},
    {k: "why", label: f.why}, {k: "o", label: f.o, type: "select", options: {"": "–", ...TA[lang].owners}}, {k: "day", label: f.day, type: "select", options: days}, {k: "time", label: f.time, type: "time"},
    {k: "cost", label: f.cost, type: "number"}, {k: "note", label: f.note}];
  const momentForm = () => [{k: "date", label: f.date, type: "date", req: true}, {k: "type", label: f.type, type: "select", options: tk.mtypes}, {k: "t", label: f.text, req: true},
    {k: "a", label: f.a, type: "select", options: {"": "–", ...areas}}, {k: "link", label: f.link, type: "url"}];
  const strip = x => Object.fromEntries(Object.entries(x).map(([k, val]) => [k, val && typeof val === "object" && "de" in val ? plain(val) : val]));
  const num = x => x === "" || x == null ? "" : +x;
  v.querySelectorAll("[data-act]").forEach(b => b.onclick = e => {
    const act = b.dataset.act, id = b.dataset.id;
    if (act !== "resetKids") e.preventDefault();
    switch (act) {
      case "addTopic": return openForm(tk.newTopic, topicForm(), {a: b.dataset.area || "motor", s: "idea", o: me(), day: "", cost: ""}, val => KD.topics.push({id: "u" + Date.now(), kid: id, ...val, cost: num(val.cost)}));
      case "editTopic": { const x = KD.topics.find(y => y.id === id);
        return openForm(TA[lang].edit, topicForm(), strip(x), val => Object.assign(x, val, {cost: num(val.cost)}), () => KD.topics.splice(KD.topics.indexOf(x), 1)); }
      case "takeIdea": { const [kid, a, de, en] = id.split("|"); KD.topics.push({id: "u" + Date.now(), kid, a, s: "idea", t: L(de, en), why: "", o: me(), day: "", time: "", cost: ""}); saveKids(); return render(); }
      case "catKid": catKid = id; return render();
      case "editMoment": { const m = KD.moments.find(y => y.id === id);
        return openForm(tk.newMoment, momentForm(), strip(m), val => Object.assign(m, val), () => KD.moments.splice(KD.moments.indexOf(m), 1)); }
      case "delCheck": KD.checks = KD.checks.filter(c => c.id !== id); saveKids(); return go(`#/kids/${b.dataset.kid}/check`);
      case "addLang": return openForm(tk.newLang, [{k: "l", label: f.l, req: true}, {k: "src", label: f.src}, {k: "level", label: f.level}], {}, val => (KD.languages[id] = KD.languages[id] || []).push({id: "u" + Date.now(), ...val}));
      case "editLang": { const [kid, lid] = id.split("|"), list = KD.languages[kid], x = list.find(y => y.id === lid);
        return openForm(TA[lang].edit, [{k: "l", label: f.l, req: true}, {k: "src", label: f.src}, {k: "level", label: f.level}], strip(x), val => Object.assign(x, val), () => list.splice(list.indexOf(x), 1)); }
      case "addTalk": case "editTalk": { const x = act === "editTalk" ? KD.kita.talks.find(y => y.id === id) : null;
        const fields = [{k: "kid", label: f.kid, type: "select", options: kidOpts}, {k: "date", label: f.date, type: "date", req: true}, {k: "with", label: f.with}, {k: "notes", label: f.notes}, {k: "agree", label: f.agree}];
        return openForm(x ? TA[lang].edit : tk.newTalk, fields, x ? strip(x) : {kid: Object.keys(KIDS)[0], date: iso(TODAY)}, val => x ? Object.assign(x, val) : KD.kita.talks.push({id: "u" + Date.now(), ...val}), x ? () => KD.kita.talks.splice(KD.kita.talks.indexOf(x), 1) : null); }
      case "addContact": case "editContact": { const x = act === "editContact" ? KD.kita.contacts.find(y => y.id === id) : null;
        const fields = [{k: "name", label: f.name, req: true}, {k: "role", label: f.role}, {k: "kid", label: f.kid, type: "select", options: kidOpts}, {k: "phone", label: f.phone, type: "tel"}];
        return openForm(x ? TA[lang].edit : tk.newContact, fields, x ? strip(x) : {kid: Object.keys(KIDS)[0]}, val => x ? Object.assign(x, val) : KD.kita.contacts.push({id: "u" + Date.now(), ...val}), x ? () => KD.kita.contacts.splice(KD.kita.contacts.indexOf(x), 1) : null); }
      case "addCare": case "editCare": { const x = act === "editCare" ? KD.kita.care.find(y => y.id === id) : null;
        const fields = [{k: "name", label: f.name, req: true}, {k: "role", label: f.role}, {k: "when", label: f.when}, {k: "phone", label: f.phone, type: "tel"}];
        return openForm(x ? TA[lang].edit : tk.newCare, fields, x ? strip(x) : {}, val => x ? Object.assign(x, val) : KD.kita.care.push({id: "u" + Date.now(), ...val}), x ? () => KD.kita.care.splice(KD.kita.care.indexOf(x), 1) : null); }
      case "resetKids": if (confirm(TA[lang].resetQ)) { KD = KIDS_EXAMPLES(); saveKids(); render(); } return;
    }
  });
  const cf = v.querySelector("#capture");
  if (cf) cf.onsubmit = e => { e.preventDefault(); const fd = new FormData(cf), t = (fd.get("t") || "").trim(); if (!t) return;
    KD.moments.push({id: "u" + Date.now(), kid: fd.get("kid"), date: iso(TODAY), type: fd.get("type"), a: fd.get("a") || "", t, by: me(), link: ""}); saveKids(); render();
    const ok = v.querySelector(".capwrap h3"); if (ok) { ok.textContent = "✓ " + ok.textContent; } };
  const chk = v.querySelector("#checkform");
  if (chk) chk.onsubmit = e => { e.preventDefault(); const fd = new FormData(chk), kid = r[1], id = "u" + Date.now();
    KD.checks.push({id, kid, date: iso(TODAY), by: me(), ratings: Object.fromEntries(Object.keys(AREAS).map(a => [a, fd.get("r_" + a)])),
      notes: Object.fromEntries(Object.keys(AREAS).map(a => [a, (fd.get("n_" + a) || "").trim()]).filter(([, n]) => n)), overall: (fd.get("overall") || "").trim()});
    saveKids(); go(`#/kids/${kid}/checklog/${id}`); };
}

/* ---------- Router: internal state (works on file://, http and in data: previews) ---------- */
let cur = location.hash || "#/";
function route() { return cur.replace(/^#\/?/, "").split("/").filter(Boolean); }
function go(h) { cur = h; try { history.pushState(null, "", h); } catch (e) {} onRoute(); }
document.addEventListener("click", e => { const a = e.target.closest('a[href^="#/"]'); if (a) { e.preventDefault(); go(a.getAttribute("href")); } });
window.addEventListener("popstate", () => { cur = location.hash || "#/"; onRoute(); });

function render() {
  if (route()[0] === "money") { location.hash = ""; return; }
  const r = route(), t = T[lang], v = document.getElementById("view");
  document.documentElement.lang = lang;
  seg("user", [[FAM.p1, FAM.p1], [FAM.p2, FAM.p2]], user, x => { user = x; try { localStorage.setItem("fom.pref.user", x); } catch (e) {} render(); });
  seg("lang", [["de", "DE"], ["en", "EN"]], lang, x => { lang = x; try { localStorage.setItem("fom.pref.lang", x); } catch (e) {} render(); });
  if (!r[0]) {
    document.getElementById("title").innerHTML = `<h1 class="greet">${t.hello(new Date().getHours())}, ${user}<span class="emo"> ☀️</span><small>${t.today}</small></h1>`;
  } else {
    const crumbs = [[t.center, "#/"], [tx(DOM[r[0]].short), `#/${r[0]}`]];
    if (r[0] === "kids") {
      const tk = TK[lang];
      if (r[1] === "kita") crumbs.push([tk.kita, ""]);
      else if (r[1] === "catalog") crumbs.push([tk.catalog, ""]);
      else if (r[1]) { crumbs.push([KIDS[r[1]].name, `#/kids/${r[1]}`]);
        if (AREAS[r[2]]) crumbs.push([tx(AREAS[r[2]]), ""]);
        else if (r[2] === "checkrun" || r[2] === "checklog") crumbs.push([tk.check, `#/kids/${r[1]}/check`], [r[2] === "checkrun" ? tk.startCheck : fmt(parse(KD.checks.find(c => c.id === r[3])?.date || iso(TODAY))), ""]);
        else if (r[2]) crumbs.push([tk[r[2]], ""]); }
    } else if (r[0] === "admin" && r[1]) {
      const ta = TA[lang];
      if (r[1] === "d") { const i = radarItems().find(x => x.id === r[2]); crumbs.push([ta.radar, "#/admin"], [i ? esc(tx(i.t)) : "–", ""]); }
      else if (r[1] === "c" && r[2]) { const c = ADMIN.contracts.find(x => x.id === r[2]); crumbs.push([ta.contracts, "#/admin/contracts"], [c ? esc(tx(c.name)) : "–", ""]); }
      else crumbs.push([ta[r[1]], ""]);
    } else if (r[0] === "money" && r[1]) {
      crumbs.push([TF[lang][r[1]], ""]);
    } else if (r[0] === "week" && r[1]) {
      crumbs.push([TW[lang][r[1]], ""]);
    } else if (r[0] === "goals" && r[1]) {
      if (r[1] === "g") { const g = GOALS.goals.find(x => x.id === r[2]); crumbs.push([TZ[lang].goals, "#/goals"], [g ? esc(tx(g.t)) : "–", ""]); }
      else crumbs.push([TZ[lang][r[1]], ""]);
    } else if (r[0] === "health" && r[1]) {
      crumbs.push([TG[lang][r[1]], ""]);
    } else if (r[0] === "home" && r[1]) {
      crumbs.push([TH[lang][r[1]], ""]);
    } else if (r[0] === "team" && r[1]) {
      const tt = TT[lang];
      if (["run", "log", "setup"].includes(r[1])) crumbs.push([tt.checkin, "#/team"], [r[1] === "run" ? tt.start : r[1] === "setup" ? tt.setupTitle : tt.chronicle, ""]);
      else crumbs.push([tt[r[1]], ""]);
    }
    document.getElementById("title").innerHTML = `<nav class="crumbs">${crumbs.map((c, i) => i === crumbs.length - 1 ? `<b>${c[0]}</b>` : `<a href="${c[1]}">${i === 0 ? '<span class="emo">☀️ </span>' : ""}${c[0]}</a>`).join("")}</nav>`;
  }
  v.innerHTML = !r[0] ? vCenter() : r[0] === "admin" ? vAdmin(r) : r[0] === "team" ? vTeam(r) : r[0] === "home" ? vHome(r) : r[0] === "health" ? vHealth(r) : r[0] === "goals" ? vGoals(r) : r[0] === "week" ? vWeek(r) : r[0] === "money" ? vMoney(r) : r[0] === "kids" ? vKidsRoute(r) : vDomain(r[0]);
  document.getElementById("note").textContent = t.note;
  bindOrbit(v);
  renderNav();
  v.querySelectorAll("[data-go]").forEach(b => b.onclick = e => { e.preventDefault(); if (Date.now() - dragEnded < 300) return; const rc = b.getBoundingClientRect(), vr = v.getBoundingClientRect();
    zoomFrom = `${rc.left + rc.width / 2 - vr.left}px ${rc.top + rc.height / 2 - vr.top}px`; go(b.dataset.go); });
  if (r[0] === "admin") bindAdmin(v);
  if (r[0] === "team") bindTeam(v);
  if (r[0] === "home") bindHome(v);
  if (r[0] === "health") bindHealth(v);
  if (r[0] === "goals") bindGoals(v);
  if (r[0] === "week") bindWeek(v);
  if (r[0] === "money") bindMoney(v);
  if (r[0] === "kids") bindKids(v, r);
}
function seg(id, opts, curV, fn) {
  const e = document.getElementById(id);
  e.innerHTML = opts.map(o => `<button class="${o[0] === curV ? "on" : ""}" data-v="${o[0]}">${o[1]}</button>`).join("");
  e.querySelectorAll("button").forEach(b => b.onclick = () => fn(b.dataset.v));
}
function onRoute() {
  const depth = route().length, v = document.getElementById("view");
  if (depth < 2) kidFilter = null;
  render(); window.scrollTo(0, 0);
  const zoomIn = depth > prevDepth;
  v.style.transformOrigin = zoomIn && zoomFrom ? zoomFrom : "50% 0";
  v.animate(zoomIn ? [{transform: "scale(.3)", opacity: 0}, {transform: "scale(1)", opacity: 1}]
                   : [{transform: "scale(1.15)", opacity: 0}, {transform: "scale(1)", opacity: 1}],
            {duration: 380, easing: "cubic-bezier(.2,.9,.25,1.05)"});
  prevDepth = depth; zoomFrom = null;
}
prevDepth = route().length;
render();

</script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const KEY = 'fos.family.v1';
  const mem = {};
  const LS = (() => { try { localStorage.setItem('fos.t', '1'); localStorage.removeItem('fos.t'); return localStorage; } catch (e) { return null; } })();
  window.FOMStore = { getItem: (k) => (LS ? LS.getItem(k) : (k in mem ? mem[k] : null)), setItem: (k, v) => { if (LS) LS.setItem(k, v); else mem[k] = v; } };
  let fam = null; try { fam = JSON.parse(FOMStore.getItem(KEY)); } catch (e) {}
  const de = () => (FOMStore.getItem('fom.pref.lang') || 'de') !== 'en';
  const T = (d, e) => (de() ? d : e);

  // ---------- Einrichtung: wer gehört zur Familie?
  function setup(edit) {
    $('wrap').hidden = true; const box = $('login'); box.hidden = false;
    box.innerHTML = `<div class="setup">
      <h2>${edit ? T('Familie bearbeiten', 'Edit family') : T('Willkommen bei Family OS', 'Welcome to Family OS')}</h2>
      <p>${T('Wer gehört zu euch? Die Namen bleiben nur auf diesem Rechner, nichts geht ins Internet.', 'Who is in your family? Names stay on this computer only, nothing goes online.')}</p>
      <form id="sform">
        <label>${T('Du', 'You')}<input id="sp1" required maxlength="24" placeholder="${T('Vorname', 'First name')}"></label>
        <label>${T('Partner:in', 'Partner')}<input id="sp2" required maxlength="24" placeholder="${T('Vorname', 'First name')}"></label>
        <div class="slabel">${T('Kinder (optional)', 'Children (optional)')}</div>
        <div id="skids"></div>
        <button type="button" class="ghost" id="saddkid">+ ${T('Kind', 'Child')}</button>
        <div class="sact"><button type="submit">${edit ? T('Speichern', 'Save') : T('Los geht\'s', 'Get started')}</button>${edit ? `<button type="button" class="ghost" id="scancel">${T('Abbrechen', 'Cancel')}</button>` : ''}</div>
      </form>
      ${edit ? '' : `<p class="small">${T('Ihr habt schon eine Sicherung?', 'Already have a backup?')} <a href="#" id="sload">${T('Sicherung laden', 'Load backup')}</a></p>`}
    </div>`;
    const addKid = (k = {}) => {
      if ($('skids').children.length >= 6) return;
      const r = document.createElement('div'); r.className = 'skid';
      r.innerHTML = `<input class="kn" maxlength="24" placeholder="${T('Name', 'Name')}"><input class="kb" type="date" aria-label="${T('Geburtstag', 'Birthday')}"><button type="button" class="x" aria-label="${T('Entfernen', 'Remove')}">×</button>`;
      r.querySelector('.kn').value = k.name || ''; r.querySelector('.kb').value = k.born || '';
      r.querySelector('.x').onclick = () => r.remove(); $('skids').appendChild(r);
    };
    if (fam) { $('sp1').value = fam.p1; $('sp2').value = fam.p2; (fam.kids || []).forEach(addKid); } else addKid();
    $('saddkid').onclick = () => addKid();
    if ($('scancel')) $('scancel').onclick = () => location.reload();
    if ($('sload')) $('sload').onclick = (e) => { e.preventDefault(); restore(); };
    $('sform').onsubmit = (e) => {
      e.preventDefault();
      const p1 = $('sp1').value.trim(), p2 = $('sp2').value.trim();
      if (p1.toLowerCase() === p2.toLowerCase()) { alert(T('Bitte zwei verschiedene Namen eintragen.', 'Please enter two different names.')); return; }
      const kids = [...document.querySelectorAll('.skid')].map((r) => ({ name: r.querySelector('.kn').value.trim(), born: r.querySelector('.kb').value }))
        .filter((k) => k.name);
      if (kids.some((k) => !k.born)) { alert(T('Bitte bei jedem Kind den Geburtstag eintragen, daraus kommen die Ideen fürs Alter.', 'Please add a birthday for each child; age-based ideas depend on it.')); return; }
      FOMStore.setItem(KEY, JSON.stringify({ p1, p2, kids }));
      if (fam && FOMStore.getItem('fom.pref.user') === fam.p1) FOMStore.setItem('fom.pref.user', p1);
      if (fam && FOMStore.getItem('fom.pref.user') === fam.p2) FOMStore.setItem('fom.pref.user', p2);
      location.hash = ''; location.reload();
    };
  }

  // ---------- Sichern und Laden
  const keys = () => { const out = {}; if (LS) for (let i = 0; i < LS.length; i++) { const k = LS.key(i); if (/^fo[ms]\./.test(k)) out[k] = LS.getItem(k); } else Object.assign(out, mem); return out; };
  function backup() {
    const data = { app: 'family-os-offline', version: 1, saved: new Date().toISOString(), keys: keys() };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
    a.download = `family-os-sicherung-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    FOMStore.setItem('fos.lastBackup', new Date().toISOString());
  }
  function restore() {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
    i.onchange = async () => {
      try {
        const d = JSON.parse(await i.files[0].text());
        if (d.app !== 'family-os-offline' || !d.keys) throw new Error(T('Das ist keine Family-OS-Sicherung.', 'This is not a Family OS backup.'));
        if (!confirm(T('Sicherung laden? Alles, was gerade hier steht, wird ersetzt.', 'Load backup? Everything currently here will be replaced.'))) return;
        Object.keys(keys()).forEach((k) => { if (LS) LS.removeItem(k); else delete mem[k]; });
        Object.entries(d.keys).forEach(([k, v]) => FOMStore.setItem(k, v));
        location.hash = ''; location.reload();
      } catch (e) { alert(T('Laden hat nicht geklappt: ', 'Loading failed: ') + e.message); }
    };
    i.click();
  }

  // ---------- Start
  if (!fam || !fam.p1 || !fam.p2) { setup(false); return; }
  window.FAM = fam;
  const pu = FOMStore.getItem('fom.pref.user');
  window.FOM_USER = pu === fam.p1 || pu === fam.p2 ? pu : fam.p1;
  window.FOM_LANG = FOMStore.getItem('fom.pref.lang') || 'de';
  $('login').hidden = true; $('wrap').hidden = false;
  const s = document.createElement('script'); s.textContent = $('fos-app').textContent; document.body.appendChild(s);
  const tail = document.createElement('div'); tail.className = 'footnote offbar';
  const link = (t, fn) => { const a = document.createElement('a'); a.href = '#'; a.textContent = t; a.onclick = (e) => { e.preventDefault(); fn(); }; return a; };
  tail.append(link(T('Sichern', 'Back up'), backup), ' · ', link(T('Sicherung laden', 'Load backup'), restore), ' · ', link(T('Familie bearbeiten', 'Edit family'), () => setup(true)));
  const last = FOMStore.getItem('fos.lastBackup');
  if (!last || Date.now() - Date.parse(last) > 30 * 864e5) tail.append(document.createElement('br'), T('Letzte Sicherung: ', 'Last backup: ') + (last ? new Date(last).toLocaleDateString() : T('noch nie', 'never')));
  $('note').after(tail);
  if (!LS) { const w = document.createElement('div'); w.className = 'footnote'; w.textContent = T('Achtung: Dieser Browser erlaubt hier kein Speichern. Bitte mit Chrome, Edge, Firefox oder Safari öffnen.', 'Note: this browser does not allow saving here. Please open with Chrome, Edge, Firefox or Safari.'); tail.after(w); }
})();
</script>
